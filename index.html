<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eva — GoUp</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #1a1a1a; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; }
header { background: #2a2a2a; padding: 16px 24px; border-bottom: 1px solid #3a3a3a; }
header h1 { font-size: 18px; color: #ff6b35; }
header p { font-size: 12px; color: #888; margin-top: 4px; }
#chat { flex: 1; overflow-y: auto; padding: 24px; max-width: 800px; width: 100%; margin: 0 auto; }
.msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
.user { background: #ff6b35; color: white; margin-left: auto; }
.eva { background: #2a2a2a; }
.system { background: #444; color: #aaa; font-style: italic; font-size: 13px; max-width: 100%; text-align: center; }
.error { background: #5a2020; color: #ffa0a0; }
#form { padding: 16px 24px; background: #2a2a2a; border-top: 1px solid #3a3a3a; display: flex; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
#input { flex: 1; background: #1a1a1a; color: white; border: 1px solid #3a3a3a; border-radius: 8px; padding: 12px; font-size: 14px; resize: none; }
#input:focus { outline: none; border-color: #ff6b35; }
button { background: #ff6b35; color: white; border: none; border-radius: 8px; padding: 0 20px; font-size: 14px; cursor: pointer; font-weight: 600; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.thinking { color: #888; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>🤖 Eva — Asistente IA de GoUp</h1>
  <p>Conectada a Supabase + Claude Sonnet 4. Memoria conversacional activa.</p>
</header>

<div id="chat">
  <div class="msg system">¡Hola! Soy Eva. Escribe tu mensaje abajo para empezar.</div>
</div>

<form id="form" onsubmit="enviar(event)">
  <textarea id="input" placeholder="Escribe tu mensaje a Eva..." rows="2" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();enviar(event);}"></textarea>
  <button type="submit" id="btn">Enviar</button>
</form>

<script>
const WEBHOOK_URL = "https://n8n-production-1059.up.railway.app/webhook/eva-v1";
const USER_ID = "mai";
let sessionId = "";

function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return div;
}

async function enviar(e) {
  e.preventDefault();
  const input = document.getElementById("input");
  const btn = document.getElementById("btn");
  const message = input.value.trim();
  if (!message) return;
  
  addMsg(message, "user");
  input.value = "";
  btn.disabled = true;
  
  const thinking = addMsg("Eva está pensando...", "eva thinking");
  
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: USER_ID,
        message: message,
        session_id: sessionId
      })
    });
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const text = await res.text();
    if (!text) {
      throw new Error("Respuesta vacía del servidor");
    }
    
    const data = JSON.parse(text);
    thinking.remove();
    
    if (data.response) {
      addMsg(data.response, "eva");
      sessionId = data.session_id || sessionId;
    } else {
      addMsg("⚠️ Eva no devolvió respuesta. Datos: " + JSON.stringify(data), "error");
    }
  } catch (err) {
    thinking.remove();
    addMsg("❌ Error: " + err.message + "\n\nVerifica que el workflow N8N esté activo.", "error");
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

document.getElementById("input").focus();
</script>
</body>
</html>
